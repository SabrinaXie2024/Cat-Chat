pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: gofmt
      root: apps/api/
      glob: "*.go"
      # Node, not a sh one-liner: must work on Windows too (see the script).
      run: node ../../scripts/gofmt-check.mjs {staged_files}
pre-push:
  jobs:
    - name: ghsa
      run: pnpm audit:ghsa
    - name: test
      run: pnpm test
