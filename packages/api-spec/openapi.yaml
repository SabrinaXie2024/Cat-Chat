openapi: 3.0.3
info:
  title: MeowSphere API
  version: 0.1.0
  description: |
    Single source of truth for the MeowSphere (喵友圈) HTTP API.
    Go server types (apps/api) and the TS client + MSW mocks (apps/web) are
    generated from this file — edit here, then run `pnpm gen`.

    Upload limits (decided from comparable sites; enforced client + server):
    images are JPEG/PNG/WebP, ≤ 5 MB each, compressed in the browser, then
    re-processed server-side (≤ 1920px long edge, JPEG, metadata stripped).
    Posts/replies reference uploaded images by id, never by external URL.
servers:
  - url: /api
security:
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /auth/register/start:
    post:
      operationId: startRegistration
      tags: [auth]
      security: []
      description: |
        Step 1 of sign-up. Validates the details and emails a 6-digit code
        valid for 5 minutes. No account exists until step 2 succeeds.
        Calling it again resends a fresh code (60 s cooldown).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationSent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Sent too recently / too often
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateLimited" }
  /auth/register/verify:
    post:
      operationId: verifyRegistration
      tags: [auth]
      security: []
      description: |
        Step 2. On the right code the account is created and signed in.
        5 wrong attempts void the code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRegistrationRequest" }
      responses:
        "201":
          description: Account created and signed in
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: Wrong code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeRejected" }
        "409":
          description: Email was registered meanwhile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: No pending code (expired, voided, or never sent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/password-reset/start:
    post:
      operationId: startPasswordReset
      tags: [auth]
      security: []
      description: |
        Forgot password, step 1. Always answers 202 for a well-formed email,
        whether or not it's registered (no account enumeration); only
        registered emails actually receive a 6-digit code (valid 5 minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetStartRequest" }
      responses:
        "202":
          description: If the email is registered, a code was sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationSent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429":
          description: Sent too recently / too often
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateLimited" }
  /auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      tags: [auth]
      security: []
      description: |
        Step 2. Right code + valid new password → password replaced, every
        existing session revoked, and this client signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetCompleteRequest" }
      responses:
        "200":
          description: Password reset and signed in
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: Wrong code (attemptsLeft) or invalid new password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeRejected" }
        "410":
          description: No valid code (expired, voided, or never sent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Too many failed attempts; retry later
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Signed out (idempotent)
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      description: |
        Requires the current password. On success every existing session for
        the user is revoked (other devices are signed out) and a fresh session
        cookie is issued to this client.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204":
          description: Password changed; session rotated
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Current password is incorrect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many failed attempts; retry later
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /images:
    post:
      operationId: uploadImage
      tags: [images]
      description: |
        Upload one image (JPEG/PNG/WebP, ≤ 5 MB). The server sniffs the real
        type, rejects oversized dimensions, applies EXIF orientation, resizes
        to ≤ 1920px on the long edge and re-encodes as JPEG — which strips all
        metadata (GPS etc). Returns an id to reference from posts/replies.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: File larger than 5 MB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /images/{imageId}:
    parameters:
      - name: imageId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getImage
      tags: [images]
      security: []
      responses:
        "200":
          description: The processed image (immutable; cache forever)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
  /gallery:
    get:
      operationId: listGallery
      tags: [gallery]
      security: []
      description: The site owner's own cat photos and videos, newest first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GalleryItem" }
    post:
      operationId: createGalleryItem
      tags: [gallery]
      description: Admin only. Publishes an uploaded image or video.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewGalleryItem" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GalleryItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /gallery/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteGalleryItem
      tags: [gallery]
      description: Admin only.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /videos:
    post:
      operationId: uploadVideo
      tags: [gallery]
      description: |
        Admin only. MP4 or WebM, ≤ 200 MB. The server checks the real
        container, remuxes with ffmpeg (no re-encode) dropping all metadata
        (GPS location, device, titles), and extracts a poster frame.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: File larger than 200 MB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /videos/{videoId}:
    parameters:
      - name: videoId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getVideo
      # Own tag so the TS client generator can skip it (browsers load it
      # directly via <video src>, never through the API client).
      tags: [media-stream]
      security: []
      description: |
        Streams the video with HTTP Range support (seeking). Implemented by
        hand in apps/api (excluded from codegen) because the generated
        strict server can't do Range requests.
      responses:
        "200":
          description: Whole file
          content:
            video/mp4: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
        "206": { description: Partial content }
        "404": { $ref: "#/components/responses/NotFound" }
  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      security: []
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Post" }
    post:
      operationId: createPost
      tags: [posts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPost" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /posts/{postId}/replies:
    parameters:
      - name: postId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listReplies
      tags: [posts]
      security: []
      responses:
        "200":
          description: Pinned reply first, then oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reply" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createReply
      tags: [posts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewReply" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reply" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Thread already has the maximum of 10 replies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/me/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      description: Change your own nickname and/or avatar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProfile
      tags: [users]
      security: []
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{userId}/posts:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listUserPosts
      tags: [users]
      security: []
      responses:
        "200":
          description: The user's posts, newest first (max 100)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Post" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{userId}/follow:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    put:
      operationId: followUser
      tags: [users]
      description: Idempotent.
      responses:
        "204": { description: Following }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: unfollowUser
      tags: [users]
      description: Idempotent.
      responses:
        "204": { description: Not following }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /posts/{postId}/like:
    parameters:
      - { name: postId, in: path, required: true, schema: { type: string } }
    put:
      operationId: likePost
      tags: [posts]
      description: Like a post. Idempotent.
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: unlikePost
      tags: [posts]
      description: Undo. Idempotent.
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /posts/{postId}/favorite:
    parameters:
      - { name: postId, in: path, required: true, schema: { type: string } }
    put:
      operationId: favoritePost
      tags: [posts]
      description: Save a post to your favorites (private). Idempotent.
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: unfavoritePost
      tags: [posts]
      description: Undo. Idempotent.
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{userId}/likes:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listUserLikes
      tags: [users]
      security: []
      responses:
        "200":
          description: Posts the user liked, most recently liked first (max 100)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Post" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/me/favorites:
    get:
      operationId: listMyFavorites
      tags: [users]
      responses:
        "200":
          description: Your favorites, most recently saved first (max 100). Private.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Post" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /users/{userId}/followers:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listFollowers
      tags: [users]
      security: []
      responses:
        "200":
          description: Who follows the user, newest first (max 100)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{userId}/following:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listFollowing
      tags: [users]
      security: []
      responses:
        "200":
          description: Whom the user follows, newest first (max 100)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
  /posts/{postId}/replies/{replyId}:
    parameters:
      - { name: postId, in: path, required: true, schema: { type: string } }
      - { name: replyId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteReply
      tags: [posts]
      description: Only the post's author may delete replies under it. Frees a reply slot.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /posts/{postId}/replies/{replyId}/pin:
    parameters:
      - { name: postId, in: path, required: true, schema: { type: string } }
      - { name: replyId, in: path, required: true, schema: { type: string } }
    put:
      operationId: pinReply
      tags: [posts]
      description: Post author only. At most one pinned reply per post; pinning another replaces it.
      responses:
        "204": { description: Pinned }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: unpinReply
      tags: [posts]
      description: Post author only. Idempotent.
      responses:
        "204": { description: Unpinned }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /posts/{postId}/replies/{replyId}/report:
    parameters:
      - { name: postId, in: path, required: true, schema: { type: string } }
      - { name: replyId, in: path, required: true, schema: { type: string } }
    post:
      operationId: reportReply
      tags: [posts]
      description: |
        Any signed-in user except the reply's author. Reports queue for the
        site admins. Reporting the same reply again updates your report.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewReport" }
      responses:
        "204": { description: Reported }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cc_session
      description: |
        Opaque random token, httpOnly + SameSite=Lax (+ Secure in prod).
        Unsafe methods are also guarded by Go's CrossOriginProtection (CSRF).
  headers:
    SessionCookie:
      description: Sets or clears the `cc_session` cookie
      schema: { type: string }
  responses:
    Forbidden:
      description: Signed in, but not allowed (admin only)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not signed in, or bad credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ReportReason:
      type: string
      enum: [spam, abuse, inappropriate, other]
    NewReport:
      type: object
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/ReportReason" }
        note: { type: string, maxLength: 200, description: "Optional details" }
    UserSummary:
      type: object
      required: [id, nickname, avatar]
      properties:
        id: { type: string }
        nickname: { type: string }
        avatar: { $ref: "#/components/schemas/Avatar" }
    Avatar:
      type: string
      description: |
        One of the site's preset cat avatars (custom uploads aren't allowed).
        The users.avatar CHECK constraint repeats this list (latest:
        migration 00007).
      enum: [orange, black, white, gray, calico, siamese, tuxedo, tabby, silver, tortie, cream, orange-white, lihua]
    ProfileUpdate:
      type: object
      properties:
        nickname: { type: string, minLength: 1, maxLength: 20 }
        avatar: { $ref: "#/components/schemas/Avatar" }
    Profile:
      type: object
      required: [id, nickname, avatar, createdAt, postCount, followerCount, followingCount, followedByMe]
      properties:
        id: { type: string }
        nickname: { type: string }
        avatar: { $ref: "#/components/schemas/Avatar" }
        createdAt: { type: string, format: date-time }
        postCount: { type: integer }
        followerCount: { type: integer }
        followingCount: { type: integer }
        followedByMe: { type: boolean, description: "false when signed out" }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    User:
      type: object
      required: [id, email, nickname, avatar, isAdmin, createdAt]
      properties:
        id: { type: string }
        avatar: { $ref: "#/components/schemas/Avatar" }
        isAdmin:
          type: boolean
          description: Site owner; may manage the gallery. Set via ADMIN_EMAILS.
        email: { type: string }
        nickname: { type: string, minLength: 1, maxLength: 20 }
        createdAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [email, password, nickname]
      properties:
        email: { type: string, maxLength: 254, description: "Validated server-side (net/mail) so errors use the JSON Error shape" }
        password: { type: string, minLength: 8, maxLength: 128 }
        nickname: { type: string, minLength: 1, maxLength: 20 }
    VerificationSent:
      type: object
      required: [expiresInSeconds, resendAfterSeconds]
      properties:
        expiresInSeconds: { type: integer }
        resendAfterSeconds: { type: integer }
    RateLimited:
      type: object
      required: [message, retryAfterSeconds]
      properties:
        message: { type: string }
        retryAfterSeconds: { type: integer }
    VerifyRegistrationRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, maxLength: 254 }
        code: { type: string, pattern: "^[0-9]{6}$" }
    PasswordResetStartRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
    PasswordResetCompleteRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email: { type: string, maxLength: 254 }
        code: { type: string, pattern: "^[0-9]{6}$" }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    CodeRejected:
      type: object
      required: [message, attemptsLeft]
      properties:
        message: { type: string }
        attemptsLeft:
          type: integer
          description: Tries left for the current code (-1 when the code wasn't the problem)
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254, description: "Validated server-side (net/mail) so errors use the JSON Error shape" }
        password: { type: string, maxLength: 128 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 128 }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    Video:
      type: object
      required: [id, url, posterUrl, width, height]
      properties:
        id: { type: string }
        url: { type: string, description: "/api/videos/{id}" }
        posterUrl: { $ref: "#/components/schemas/ImageUrl" }
        width: { type: integer }
        height: { type: integer }
    NewGalleryItem:
      type: object
      required: [kind, mediaId, caption]
      properties:
        kind: { type: string, enum: [photo, video] }
        mediaId:
          type: string
          description: An image id (photo) or video id (video) uploaded by an admin
        caption: { type: string, maxLength: 200 }
    GalleryItem:
      type: object
      required: [id, kind, url, width, height, caption, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [photo, video] }
        url: { type: string }
        posterUrl: { $ref: "#/components/schemas/ImageUrl" }
        width: { type: integer }
        height: { type: integer }
        caption: { type: string, maxLength: 200 }
        createdAt: { type: string, format: date-time }
    ImageId:
      type: string
      description: Id returned by uploadImage. Must belong to the author.
    ImageUrl:
      type: string
      description: Path to the processed image, e.g. /api/images/{id}
    Image:
      type: object
      required: [id, url, width, height]
      properties:
        id: { $ref: "#/components/schemas/ImageId" }
        url: { $ref: "#/components/schemas/ImageUrl" }
        width: { type: integer }
        height: { type: integer }
    NewPost:
      type: object
      required: [content, images]
      properties:
        content: { type: string, minLength: 1, maxLength: 500 }
        images:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/ImageId" }
    Post:
      type: object
      required: [id, authorId, authorAvatar, author, content, images, replyCount, likeCount, likedByMe, favoritedByMe, createdAt]
      properties:
        id: { type: string }
        author: { type: string }
        authorId: { type: string }
        authorAvatar: { $ref: "#/components/schemas/Avatar" }
        content: { type: string, maxLength: 500 }
        images:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/ImageUrl" }
        replyCount: { type: integer, minimum: 0, maximum: 10 }
        likeCount: { type: integer, minimum: 0 }
        likedByMe: { type: boolean, description: "false when signed out" }
        favoritedByMe: { type: boolean, description: "false when signed out" }
        createdAt: { type: string, format: date-time }
    NewReply:
      type: object
      required: [content, images]
      properties:
        content: { type: string, minLength: 1, maxLength: 100 }
        images:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ImageId" }
    Reply:
      type: object
      required: [id, authorId, authorAvatar, postId, author, content, images, pinned, createdAt]
      properties:
        id: { type: string }
        postId: { type: string }
        author: { type: string }
        authorId: { type: string }
        authorAvatar: { $ref: "#/components/schemas/Avatar" }
        content: { type: string, maxLength: 100 }
        images:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ImageUrl" }
        pinned: { type: boolean, description: "Pinned by the post's author (listed first)" }
        createdAt: { type: string, format: date-time }
